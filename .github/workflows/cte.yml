name: CTE Linux app checks
on:
  pull_request:
    paths:
      - 'cte/**'
      - 'mdxl_preview.py'
      - 'requirements-preview.txt'
      - 'tests/test_cte_backend.py'
  push:
    branches: [main]
    paths:
      - 'cte/**'
      - 'mdxl_preview.py'
      - 'requirements-preview.txt'
      - 'tests/test_cte_backend.py'
jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PySide6 -r requirements-preview.txt
      - run: python -m py_compile cte/cte.py mdxl_preview.py
      - name: Test QML-backed CTE document controller
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -p 'test_cte_backend.py'
      - name: Check QML and desktop assets exist
        run: python -c "from pathlib import Path; assert Path('cte/main.qml').is_file(); assert Path('cte/cte.desktop').is_file(); assert Path('cte/cte.svg').is_file()"
